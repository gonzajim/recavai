# =====================================================================================
# cloudbuild.yaml — despliegue del orquestador + hosting, parametrizado por entorno
# =====================================================================================
# NO se ejecuta solo: el trigger antiguo apuntaba a un proyecto GCP que ya no es
# accesible, llevaba meses muerto y se retiró. Hasta que se cree un trigger nuevo,
# este fichero se lanza a mano con `scripts/deploy.sh` o con:
#
#   gcloud builds submit --config=cloudbuild.yaml --project=recava-auditor-dev \
#     --substitutions=_SERVICE_NAME=orchestrator-dev,_FIREBASE_PROJECT_ALIAS=dev,_TRAFFIC=latest
#
# Entornos reales (comprobado 2026-09-19):
#   dev   proyecto recava-auditor-dev  · servicio orchestrator-dev  · sitios recava-auditor-dev[-panel]
#         Es el entorno VIVO: lo que usan hoy los usuarios.
#   prod  proyecto recava-auditor-prod · SIN FACTURACIÓN habilitada, sin Secret Manager.
#         No operativo. Ver docs/DESPLIEGUE.md antes de intentar usarlo.
#
# _TRAFFIC controla el riesgo del despliegue:
#   canary  (por defecto) revisión nueva SIN tráfico, accesible por su etiqueta para probar.
#   latest  envía el 100% del tráfico a la revisión nueva.
# =====================================================================================

steps:
  # -------------------------------------------------------------------------------------
  # 1. Imagen del backend (BuildKit + caché embebida en la propia imagen)
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build-Backend-Image'
    env: ['DOCKER_BUILDKIT=1']
    args:
      - 'build'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--build-arg'
      - 'EMBEDDING_MODEL=${_EMBEDDING_MODEL}'
      - '--cache-from'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:${SHORT_SHA}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push-Backend-Image'
    args: ['push', '--all-tags',
           'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}']
    waitFor: ['Build-Backend-Image']

  # -------------------------------------------------------------------------------------
  # 2. Cloud Run. En modo canary la revisión queda SIN tráfico y se prueba por su etiqueta.
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy-Backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # $$ escapa el $ para que Cloud Build no lo tome por una sustitución suya.
        TRAFFIC_ARGS="--no-traffic --tag=${_CANARY_TAG}"
        if [ "${_TRAFFIC}" = "latest" ]; then TRAFFIC_ARGS=""; fi
        gcloud run deploy ${_SERVICE_NAME} \
          --image europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:${SHORT_SHA} \
          --region europe-west1 --platform managed --project ${PROJECT_ID} \
          --allow-unauthenticated --port 8080 \
          --update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest,BIGQUERY_DATASET_ID=BIGQUERY_DATASET_ID:latest,BIGQUERY_TABLE_ID=BIGQUERY_TABLE_ID:latest \
          --remove-secrets=NEO4J_PASSWORD \
          --set-env-vars=EMBEDDING_MODEL_NAME=${_EMBEDDING_MODEL},RAG_INDEX_NAME=${_RAG_INDEX},RAG_MIN_SCORE=${_RAG_MIN_SCORE},RAG_NORMATIVE_GRAPH=${_RAG_GRAPH},RAG_UNIT_STORE=${_RAG_UNITS},RAG_CONTEXT_MAX_LEVEL=${_RAG_MAX_LEVEL},RAG_THINKING_BUDGET=${_RAG_THINKING},RAG_PLANNER=${_RAG_PLANNER} \
          --timeout=600s --concurrency=16 --cpu=2 --memory=4Gi \
          $$TRAFFIC_ARGS
        if [ "${_TRAFFIC}" != "latest" ]; then
          # La URL etiquetada es la del servicio con el prefijo "TAG---". Se construye
          # así y no con un filtro de --format porque las proyecciones de gcloud no
          # saben filtrar una lista por el valor de uno de sus campos.
          BASE=$(gcloud run services describe ${_SERVICE_NAME} --region europe-west1 \
                   --project ${PROJECT_ID} --format='value(status.url)')
          echo "=============================================================="
          echo "Revisión desplegada SIN tráfico. Pruébala aquí:"
          echo "  https://${_CANARY_TAG}---$${BASE#https://}"
          echo "Cuando convenza:  ./scripts/deploy.sh promote ${_ENV}"
          echo "=============================================================="
        fi
    waitFor: ['Push-Backend-Image']

  # -------------------------------------------------------------------------------------
  # 3. Frontend: panel de administración (React) — el widget de chat es estático
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/npm'
    id: 'Build-Admin-Panel'
    entrypoint: 'bash'
    dir: 'public/admin-panel'
    waitFor: ['-']            # en paralelo con el backend
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_TRAFFIC}" != "latest" ]; then
          echo "Modo canary: el panel no se compila (no se despliega hosting)."
          exit 0
        fi
        # `npm ci` exige que package.json y package-lock.json estén sincronizados, y
        # hoy no lo están (typescript 5.8.3 en el lock frente a 4.9.5 en package.json).
        # Se intenta la vía reproducible y se cae a `npm install` si falla.
        npm ci || { echo "AVISO: package-lock.json desincronizado; usando npm install"; npm install; }
        npm run build

  # -------------------------------------------------------------------------------------
  # 4. Firebase Hosting. En canary NO se despliega: el frontend iría al 100% de usuarios
  #    mientras el backend nuevo todavía no recibe tráfico, y quedarían descompasados.
  # -------------------------------------------------------------------------------------
  - name: 'node:18'
    id: 'Deploy-Hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_TRAFFIC}" != "latest" ]; then
          echo "Modo canary: hosting NO se despliega (evita descompasar frontend y backend)."
          exit 0
        fi
        npm install --no-save firebase-tools
        ./node_modules/.bin/firebase deploy --only hosting \
          --project ${_FIREBASE_PROJECT_ALIAS} --non-interactive --force
    waitFor: ['Deploy-Backend', 'Build-Admin-Panel']
    dir: '.'

# =====================================================================================
# Valores por defecto: entorno DEV, que es el entorno vivo, y despliegue CANARY,
# que es el que no puede romper nada. Producción exige pasarlos explícitamente.
# =====================================================================================
substitutions:
  _ENV: 'dev'
  _SERVICE_NAME: 'orchestrator-dev'
  _FIREBASE_PROJECT_ALIAS: 'dev'
  _TRAFFIC: 'canary'
  _CANARY_TAG: 'canary'
  # Índice, modelo y umbral van JUNTOS: cambiar uno sin los otros rompe la búsqueda (ARC-3).
  # v1: uclm-corpus-roma + sentence-transformers/all-MiniLM-L6-v2 + 0.55
  # v2: recavai-corpus-v2 + intfloat/multilingual-e5-small + 0.841 (scripts/calibrate_threshold.py)
  _EMBEDDING_MODEL: 'intfloat/multilingual-e5-small'
  _RAG_INDEX: 'recavai-corpus-v2'
  _RAG_MIN_SCORE: '0.841'
  # Ruta del grafo normativo dentro de la imagen; vacío = desactivado.
  _RAG_GRAPH: '/app/data/normative_graph.json'
  # Contexto adaptativo (docs/PLAN_CONTEXTO.md). Almacén de unidades: vacío = un bloque por
  # fragmento, como antes. Nivel máximo S | M | L (M quita el nivel L y la segunda pasada).
  # Razonamiento: 0 = sin razonamiento interno; vacío = dinámico (el de antes, 2-4 veces más lento).
  # Planificador: 0 = desactivado (no pasó la regla de adopción el 24/09/2026).
  _RAG_UNITS: '/app/data/unidades.json.gz'
  _RAG_MAX_LEVEL: 'L'
  _RAG_THINKING: '0'
  _RAG_PLANNER: '0'

images:
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:${SHORT_SHA}'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  dynamicSubstitutions: true
